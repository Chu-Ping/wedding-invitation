<!doctype html>
<html lang="zh-Hant" class="invitation-locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .invitation-locked #invitation { filter: blur(28px); pointer-events: none; user-select: none; }
    .password-gate { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; background: #eeece2cc; }
    [hidden] { display: none !important; }
  </style>
  <title data-i18n="Invitation：佑琦 &amp; 竹平">Invitation：佑琦 &amp; 竹平</title>
  <link rel="stylesheet" href="styles.css?v=20261108-soft-glow">
  <script type="importmap">
    { "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    } }
  </script>
  <script type="module" src="entry.js?v=20261108-soft-glow"></script>
</head>
<body>
  <section id="password-gate" class="password-gate" role="dialog" aria-modal="true" aria-labelledby="password-title">
    <div class="password-panel">
      <div class="password-heading"><h1 id="password-title" data-i18n="Enter the invitation password">請輸入邀請密碼</h1><button type="button" data-language-toggle>En - 繁 - 简</button></div>
      <form id="password-form" method="post">
        <label for="invitation-password" data-i18n="Password">密碼</label>
        <input id="invitation-password" type="password" inputmode="numeric" autocomplete="current-password" required aria-describedby="password-error" autofocus>
        <p id="password-error" role="status" aria-live="polite" hidden></p>
        <button id="password-submit" type="submit" data-i18n="Enter" disabled>進入</button>
      </form>
      <noscript><p>Enable JavaScript to enter. / 請啟用 JavaScript。 / 请启用 JavaScript。</p></noscript>
    </div>
  </section>
  <div id="invitation" inert>
  <header class="page-header">
    <div><span class="eyebrow" data-i18n="Invitation：佑琦 &amp; 竹平">Invitation：佑琦 &amp; 竹平</span><h1 data-i18n="Explore our room">Explore our room</h1></div>
    <div class="header-controls">
      <button id="language-toggle" type="button" data-language-toggle>En - 繁 - 简</button>
      <button id="free-explore" type="button" aria-pressed="false" aria-controls="hotspots object-list" data-i18n="Free exploration">Free exploration</button>
      <button id="show-invitation" type="button" aria-haspopup="dialog" aria-controls="shelf-gallery" data-i18n="Show invitation">Show invitation</button>
    </div>
    <p id="scene-hint" hidden></p>
  </header>
  <main>
    <div class="scene-layout">
      <div class="stage" id="stage" data-state="room" aria-label="Interactive room scene">
        <div class="room" id="room">
          <img id="backdrop" src="resource/images/main_scene/whole_scene_cartoon.png" width="1448" height="1086" alt="A block-style cartoon room with coffee equipment, wall shelves, a side cabinet and a large plant." data-style="cartoon" fetchpriority="high">
          <div id="hotspots" aria-label="Objects in the room"></div>
        </div>
        <section class="photo-view" id="photo-view" aria-labelledby="photo-title" hidden>
          <div class="photo-heading"><span class="eyebrow" data-i18n="A closer look">A closer look</span><h2 id="photo-title" tabindex="-1"></h2></div>
          <div class="photo-frame"><img id="detail-photo" alt="" hidden><canvas id="animation-canvas" role="img" aria-label="Animation" hidden></canvas></div>
          <div id="animation-controls" class="animation-controls" aria-label="Animation playback controls" hidden>
            <button id="animation-play" type="button" data-i18n="Play animation">Play animation</button>
            <button id="animation-replay" type="button" data-i18n="Replay">Replay</button>
          </div>
          <nav id="photo-variants" class="photo-variants" aria-label="Alternate views" hidden></nav>
        </section>
        <section class="model-view" id="model-view" aria-label="Object viewer" hidden>
          <div class="viewer-heading"><span class="eyebrow" data-i18n="A closer look">A closer look</span><h2 id="model-title"></h2></div>
          <div id="model-canvas" class="model-canvas" tabindex="0" role="group" aria-label="Object. Drag to rotate or scroll to zoom."></div>
          <div class="detail-switches">
            <button id="detail-mode-button" type="button" aria-controls="model-canvas backdrop" aria-pressed="false" data-i18n="Show room image">Show room image</button>
          </div>
        </section>
        <button id="back-button" class="back-button" type="button" data-i18n="← Back to room" hidden>← Back to room</button>
        <div class="status-panel" id="status-panel" hidden>
          <p id="status" role="status" aria-live="polite"></p>
          <button id="retry-button" type="button" data-i18n="Try again" hidden>Try again</button>
        </div>
      </div>
      <aside id="model-copy" class="model-copy" aria-label="About this object" tabindex="0" hidden></aside>
      <div id="animation-copy" class="animation-copy" hidden></div>
    </div>
    <section id="pegboard-objects" class="shelf-objects" aria-label="Pegboard object buttons" hidden>
      <p id="pegboard-selection" role="status" aria-live="polite"></p>
      <div class="object-list"><button id="coffee-bag-button" type="button" aria-pressed="false" aria-haspopup="dialog" aria-controls="item-reward" data-i18n="Coffee bag">Coffee bag</button></div>
    </section>
    <section id="grinder-objects" class="shelf-objects" aria-label="Grinder button" hidden>
      <p id="grinder-selection" role="status" aria-live="polite"></p>
      <div class="object-list"><button id="grinder-button" type="button" aria-pressed="false" aria-haspopup="dialog" aria-controls="item-reward" data-i18n="Grinder button">Grinder button</button></div>
    </section>
    <section id="espresso-objects" class="shelf-objects" aria-label="Espresso machine button" hidden>
      <p id="espresso-selection" role="status" aria-live="polite"></p>
      <div class="object-list"><button id="espresso-center-button" type="button" aria-pressed="false" aria-haspopup="dialog" aria-controls="item-reward" data-i18n="Center button">Center button</button></div>
    </section>
    <section id="cabinet-objects" class="shelf-objects" aria-label="Cabinet object buttons" hidden>
      <p id="cabinet-selection" role="status" aria-live="polite"></p>
      <div id="cabinet-object-buttons" class="object-list"></div>
    </section>
    <section id="shelf-objects" class="shelf-objects" aria-label="Shelf object buttons" hidden>
      <p id="shelf-selection" role="status" aria-live="polite"></p>
      <div id="shelf-object-buttons" class="object-list"></div>
    </section>
    <nav id="object-list" class="object-list" aria-label="Explore room objects"></nav>
    <section class="room-music" aria-label="Background music">
      <audio id="background-music" controls loop preload="metadata" aria-label="Background music: Just the Two of Us by Joanna Wang">
        <source src="resource/sound/Joanna_Wang_-_Just_The_Two_Of_Us_(mp3.pm).mp3" type="audio/mpeg">
      </audio>
      <p>Just the Two of Us · Joanna Wang</p>
    </section>
    <noscript><p>Enable JavaScript to explore the room objects.</p></noscript>
  </main>
  <dialog id="item-reward" class="shelf-gallery reward-dialog" aria-labelledby="item-reward-title" aria-describedby="item-reward-text">
    <div class="shelf-gallery-heading">
      <h2 id="item-reward-title"></h2>
      <div class="dialog-actions">
        <button type="button" data-language-toggle>En - 繁 - 简</button>
        <button type="button" data-reward-close data-i18n="Close ×" data-i18n-label="Close item and return to the model" aria-label="Close item and return to the model">Close ×</button>
      </div>
    </div>
    <div class="reward-content">
      <img alt="" hidden>
      <p id="item-reward-text" data-reward-text hidden></p>
    </div>
    <p data-reward-status role="status" aria-live="polite"></p>
    <button type="button" data-reward-retry data-i18n="Try again" hidden>Try again</button>
  </dialog>
  <dialog id="shelf-gallery" class="shelf-gallery" aria-labelledby="shelf-gallery-title">
    <div class="shelf-gallery-heading">
      <div><span class="eyebrow" data-i18n="A little collection">A little collection</span><h2 id="shelf-gallery-title"></h2></div>
      <div class="dialog-actions">
        <button type="button" data-language-toggle>En - 繁 - 简</button>
        <button type="button" data-close-gallery data-i18n="Close photos ×" data-i18n-label="Close photos and return to the scene" aria-label="Close photos and return to the scene">Close photos ×</button>
      </div>
    </div>
    <div class="shelf-gallery-content">
      <div class="shelf-photo-spread"></div>
      <div class="shelf-gallery-copy" hidden></div>
    </div>
    <div class="shelf-gallery-footer" data-gallery-footer hidden>
      <h3 data-i18n="RSVP questionnaire">RSVP questionnaire</h3>
      <iframe class="rsvp-form" data-gallery-form title="RSVP questionnaire"></iframe>
    </div>
  </dialog>
  </div>
</body>
</html>
